{% load i18n %}{% get_current_language as CURRENT_LANGUAGE %}
<form class="language-switcher" action="{% url 'set_language' %}" method="post">
  {% csrf_token %}
  <input name="next" type="hidden" value="{{ request.get_full_path }}">
  <input name="language" type="hidden" value="{% if CURRENT_LANGUAGE == 'ar' %}en{% else %}ar{% endif %}">
  <button type="submit" lang="{% if CURRENT_LANGUAGE == 'ar' %}en{% else %}ar{% endif %}">
    {% if CURRENT_LANGUAGE == 'ar' %}{{ "English" }}{% else %}العربية{% endif %}
  </button>
</form>
