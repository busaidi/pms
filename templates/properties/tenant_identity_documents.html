{% for document in identity_documents %}<div class="rate-row"><a href="{% url 'tenant_document_download' document.tenant_id document.pk %}"><strong>{{ document.name }}</strong><small>{{ document.get_document_type_display }} · {{ document.created_at|date:"d/m/Y" }}</small></a>{% if allow_identity_delete %}<form method="post" action="{% url 'tenant_document_delete' document.tenant_id document.pk %}">{% csrf_token %}<button class="link-button" type="submit">حذف</button></form>{% endif %}</div>{% empty %}<p class="muted">لم تُرفق بطاقة شخصية أو جواز سفر لهذا المستأجر بعد.</p>{% endfor %}
